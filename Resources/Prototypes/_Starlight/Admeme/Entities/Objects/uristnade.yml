- type: entity
  parent: [ScatteringGrenadeBase, TimerGrenadeBase]
  id: GrenadeUrist
  name: uristnade
  description: Releases a whole bunch of oddly generic humans.
  suffix: Admeme
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Objects/uristnade.rsi/ #todo: sprite
    layers:
    - state: icon
      map: ["Base"]
    - state: primed
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ScatteringGrenade
    fillPrototype: MobHuman
    capacity: 30
    velocity: 0
  - type: TimerTrigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      collection: MaleScreams
    positional: true

- type: entity
  parent: [ScatteringGrenadeBase, TimerGrenadeBase]
  id: GrenadeSalvCorpse
  name: corpsenade
  description: Probably the MOST unethical thing you could ask for for christmas.
  suffix: Admeme
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Objects/deadnade.rsi/ #todo: sprite
    layers:
    - state: icon
      map: ["Base"]
    - state: primed
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ScatteringGrenade
    fillPrototype: SalvageHumanCorpse
    capacity: 30
    velocity: 0
  - type: TimerTrigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      collection: gib
    positional: true
